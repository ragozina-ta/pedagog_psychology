services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resource
      POSTGRES_PASSWORD: resource
      POSTGRES_DB: resource
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://resource:resource@db:5432/resource
      SECRET_KEY: change-me-in-production-super-secret-key
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://whatislav.online,https://www.whatislav.online,https://ragozina-ta.github.io
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db

volumes:
  pgdata:
